name: Look for new publications

# Weekly: ask OpenAlex what it knows that content/publications.md does not, and
# whether the citation ranking behind the selected-publications block has moved.
# Anything to act on goes into one issue.
#
# It deliberately does not commit. The publication list is the authoritative
# record and content/highlights.md is maintained by hand; both need a human eye.
# OpenAlex truncates author lists, leaves the venue empty on most conference
# papers, and sometimes files another Shinji Watanabe's work under this author id.

on:
  schedule:
    - cron: "0 7 * * 1"      # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ask OpenAlex
        id: look
        run: |
          # one fetch, shared by both checks
          python3 find_new.py --fetch
          python3 highlights.py --check highlights-report.md -n 10

          : > issue-body.md
          new=$(( $(grep -c '^```$' new-publications.md || echo 0) / 2 ))
          if [ "$new" -gt 0 ]; then
            cat new-publications.md >> issue-body.md
            printf '\n' >> issue-body.md
          fi
          if [ -s highlights-report.md ]; then
            cat highlights-report.md >> issue-body.md
          fi

          if [ -s issue-body.md ]; then
            echo "anything=yes" >> "$GITHUB_OUTPUT"
          else
            echo "anything=no" >> "$GITHUB_OUTPUT"
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Open an issue when there is something to act on
        if: steps.look.outputs.anything == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Publications check ($(date +%Y-%m-%d))"
          # replace last week's rather than stacking them up
          old=$(gh issue list --label new-publications --state open \
                  --json number --jq '.[].number')
          gh issue create --title "$title" \
                          --label new-publications \
                          --body-file issue-body.md
          for n in $old; do
            gh issue close "$n" --comment "Superseded by a newer check."
          done
